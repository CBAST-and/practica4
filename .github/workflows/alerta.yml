name: Notificacion NTFY

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ver archivos (debug)
        run: ls -la

      - name: Ejecutar Hola Mundo
        run: node index.js

      - name: Enviar notificacion
        run: |
          curl -X POST https://ntfy.sh/devops-itla \
          -H "Title: Nuevo Push en Main" \
          -d "Se ha realizado un push a la rama main en el repositorio ${{ github.repository }} por ${{ github.actor }}"
